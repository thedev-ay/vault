name: Release system update

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm run build

      - name: Verify tag matches package version
        run: node -e "const expected='v'+require('./package.json').version; if (process.env.GITHUB_REF_NAME !== expected) throw new Error('Tag must be '+expected)"

      - name: Create verified package
        run: |
          ORIGINAL=$(npm pack --json | node -e "let value=''; process.stdin.on('data', chunk => value += chunk); process.stdin.on('end', () => process.stdout.write(JSON.parse(value)[0].filename))")
          ARCHIVE="vault-system-${GITHUB_REF_NAME#v}.tgz"
          mv "$ORIGINAL" "$ARCHIVE"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" vault-system-*.tgz vault-system-*.tgz.sha256 --verify-tag --generate-notes --title "Vault $GITHUB_REF_NAME"
